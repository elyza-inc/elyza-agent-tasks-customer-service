[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elyza-agent-tasks-customer-service"
version = "1.1.0"
description = "コールセンター業務を題材にした日本語エージェント評価ベンチマークの評価コード"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "websockets==15.0.1",
  "google-auth==2.58.0",
  "numpy==1.26.4",
  "spacy==3.7.5",
  "thinc==8.2.5",
  "typer==0.26.8",
  "click==8.1.8",
  "ginza==5.2.0",
  "ja-ginza==5.2.0",
  "SudachiPy==0.6.11",
  "SudachiDict-core==20260723",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"elyza_agent_tasks_customer_service.evaluation" = [
  "prompt_templates/*",
  "README.md",
]
